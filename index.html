<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Type any GitHub username and explore that profile as a low-poly 3D city."
    />
    <title>GitHub World — explore any profile as a 3D city</title>
    <meta name="theme-color" content="#0b1020" />
    <!-- Social preview. og:image is intentionally absent: a screenshot would go
         stale every time the city changes. Add one at a stable URL if wanted. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GitHub World — explore any profile as a 3D city" />
    <meta
      property="og:description"
      content="Repos become buildings: height is code size, a spire means stars, lit windows mean recent work."
    />
    <meta property="og:url" content="https://akhileshnagargoje.github.io/github-world/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GitHub World — explore any profile as a 3D city" />
    <meta
      name="twitter:description"
      content="Repos become buildings: height is code size, a spire means stars, lit windows mean recent work."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
